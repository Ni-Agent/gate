# Optional /etc/systemd/system/gate.service.d/grok.conf.
# Match the origin and all existing ExecStart flags to your running service.
[Service]
LoadCredential=grok-client.json:/etc/gate/grok-client.json
ExecStart=
ExecStart=/usr/local/libexec/gate -addr 127.0.0.1:18084 -public-url https://gate.example.org -credentials ${CREDENTIALS_DIRECTORY}/oauth.json -tokens ${CREDENTIALS_DIRECTORY}/tokens.json -repo /var/lib/gate/workspace.git -oauth-state /var/lib/gate/auth/sessions.json -grok-client-metadata ${CREDENTIALS_DIRECTORY}/grok-client.json
